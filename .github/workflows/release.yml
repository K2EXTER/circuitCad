name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bin: circuitCad.exe
          # macOS and Linux have never been built or run by the author: add them back (and drop
          # `prerelease` below when ready) once someone has checked them.
          # - os: macos-latest
          #   name: macos-arm64
          #   bin: circuitCad
          # - os: ubuntu-latest
          #   name: linux-x64
          #   bin: circuitCad
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build -p app --release
      - name: Package
        shell: bash
        run: |
          d=circuitCad-${{ matrix.name }}
          mkdir "$d"
          cp "target/release/${{ matrix.bin }}" "$d/"
          cp -r docs README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.txt "$d/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$d.zip" "$d"; else zip -r "$d.zip" "$d"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: circuitCad-${{ matrix.name }}.zip
          # an early version: shown as a pre-release, not as the latest release
          prerelease: true
          generate_release_notes: true

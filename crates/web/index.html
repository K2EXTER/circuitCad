<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <!-- a phone shows the page at its own width, and the pinch goes to the app (it zooms the schematic), not to the page -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>circuitCad (ブラウザ版)</title>
    <link data-trunk rel="rust" data-bin="circuitCad-web" data-wasm-opt="z" />
    <!-- the licence of the Japanese font inside the app (BIZ UD Gothic, SIL OFL 1.1), served as OFL.txt -->
    <link data-trunk rel="copy-file" href="../app/assets/fonts/OFL.txt" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #181a1e; color: #ddd; font-family: sans-serif; }
        #ccad_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
        #ccad_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <canvas id="ccad_canvas"></canvas>
    <div id="ccad_loading"><p>読み込んでいます… (Loading)</p></div>
</body>
</html>

[package]
name = "app"
version = "0.1.0"
edition = "2024"
description = "circuitCad: 回路図・SPICEシミュレーション・基板設計・製造データ出力を1本で行う、学習向けの回路CAD"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tetoranatti/circuitCad"

[[bin]]
name = "circuitCad"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
part-lib = { version = "0.1.0", path = "../part-lib" }
pcb-core = { version = "0.1.0", path = "../pcb-core" }
rfd = "0.17.2"
sch-core = { version = "0.1.0", path = "../sch-core" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0.151"
sim-core = { version = "0.1.0", path = "../sim-core" }

[package]
name = "cli"
version = "0.1.0"
edition = "2024"
description = "ccad: circuitCad without the window. A line-oriented script (build a schematic by name, check, simulate, make a board, export) with one JSON object per answer, for scripts and AI agents."
license = "AGPL-3.0-or-later"
repository = "https://github.com/K2EXTER/circuitCad"

[[bin]]
name = "ccad"
path = "src/main.rs"

[dependencies]
design-spec = { version = "0.1.0", path = "../design-spec" }
image = { version = "0.25", default-features = false, features = ["png"] }
part-lib = { version = "0.1.0", path = "../part-lib" }
pcb-core = { version = "0.1.0", path = "../pcb-core" }
sch-core = { version = "0.1.0", path = "../sch-core" }
serde_json = "1.0.151"
sim-core = { version = "0.1.0", path = "../sim-core" }

[dev-dependencies]
zip = "8.6.0"

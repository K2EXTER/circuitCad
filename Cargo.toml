[workspace]
resolver = "2"
members = ["crates/pcb-core", "crates/sch-core", "crates/design-spec", "crates/part-lib", "crates/datasheet", "crates/i18n", "crates/sim-core", "crates/app", "crates/cli"]

# Debug builds of egui and the solver are very slow (a frame of a busy board took 15 ms, a transient run 20 s).
# Optimise the dependencies fully and our own crates lightly; overflow checks stay, debug info is reduced to line tables.
[profile.dev]
opt-level = 1
# backtraces keep line numbers; full debug info made cold builds ~18% slower and target/ ~60% larger
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# no debug info for dependencies: the PDB shrank 137 -> 69 MB and relinks got faster;
# backtraces still have line numbers in our own crates
debug = false
